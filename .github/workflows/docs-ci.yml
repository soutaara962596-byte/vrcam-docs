name: Docs CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: docs-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .node-version }
      - run: npm install --global --ignore-scripts pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check && pnpm test && pnpm build
      - run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Preview artifact (no public deployment)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
